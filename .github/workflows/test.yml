name: tests

on:
  push:
  pull_request:

jobs:
  hooks:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, python: "3.7" }
          - { os: ubuntu-latest, python: "3.8" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.8" }
          - { os: windows-latest, python: "3.13" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every script
        run: python -m compileall -q hooks tools skills tests
      - name: Run the tests
        run: python -m unittest discover -s tests -v
