name: tests

on:
  push:
  pull_request:

jobs:
  hooks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile every script
        run: python -m compileall -q hooks tools skills
      - name: Run the tests
        run: python -m unittest discover -s tests -v
